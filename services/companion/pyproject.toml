[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openra-ai-companion"
version = "0.1.0"
description = "Interruptible, AI-layer-routed OpenRA game companion"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.67,<2",
  "mcp>=1.21,<2",
  "openai-agents>=0.18,<0.19",
  "protobuf>=5.29,<7"
]

[project.optional-dependencies]
voice = ["sounddevice>=0.5,<1"]
dev = ["grpcio-tools>=1.67,<2"]
package = ["pyinstaller>=6.16,<7"]

[project.scripts]
openra-ai-companion = "openra_ai_companion.cli:main"
openra-ai-game-mcp = "openra_ai_companion.game_mcp:main"

[tool.setuptools.packages.find]
where = ["src"]
