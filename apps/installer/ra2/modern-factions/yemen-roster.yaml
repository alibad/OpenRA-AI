		Name: ra2-r2yzunest-name
	Buildable:
		Prerequisites: ~faction.yemen, barracks, radar
		BuildPaletteOrder: 30
		Description: ra2-r2yzunest-description
	Valued:
		Cost: 800
	Health:
		HP: 450
	Power:
		Amount: -30
	Armament:
		Weapon: R2ZUNest
		LocalOffset: 700,0,650
	WithRangeCircle:
		Range: 9c0

r2ycoastal:
	Inherits: ^R2YemenDefense
	Inherits@concealed: ^R2YemenConcealed
	Tooltip:
		Name: ra2-r2ycoastal-name
	Buildable:
		Prerequisites: ~faction.yemen, radar
		BuildPaletteOrder: 40
		Description: ra2-r2ycoastal-description
	Valued:
		Cost: 1200
	Health:
		HP: 600
	Power:
		Amount: -50
	Armament:
		Weapon: R2YemenCoastalMissile
		LocalOffset: 600,0,650
	# Surveillance-craft links also coordinate the shore battery.
	ExternalCondition@targeting:
		Condition: r2-ye-targeting
	RangeMultiplier@targeting:
		Modifier: 120
		RequiresCondition: r2-ye-targeting
	WithRangeCircle:
		Range: 12c0
