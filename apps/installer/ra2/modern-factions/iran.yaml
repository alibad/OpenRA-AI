naweap:
	GrantConditionOnProduction@iran-drone:
		Actors: r2mohajer, r2toufan, r2azar, r2loiter
		Condition: roof-open
		Duration: 50
		ShowSelectionBar: false

r2karrar:
	Inherits: ^R2ModernVehicle
	Tooltip:
		Name: ra2-r2karrar-name
	Buildable:
		BuildPaletteOrder: 21
		Prerequisites: ~faction.iran, naweap
		Description: ra2-r2karrar-description
	Valued:
		Cost: 900
	Health:
		HP: 420
	Armor:
		Type: Heavy
	Mobile:
		Speed: 85
	Armament:
		Weapon: R2KarrarGun
		MuzzleSequence: muzzle
	Voiced:
		VoiceSet: SovietVehicleVoice

r2raad:
	Inherits: ^R2ModernVehicle
	Inherits@AUTOTARGET: ^AutoTargetAir
	Tooltip:
		Name: ra2-r2raad-name
	Buildable:
		BuildPaletteOrder: 41
		Prerequisites: ~faction.iran, naweap
		Description: ra2-r2raad-description
	Valued:
		Cost: 1000
	Health:
		HP: 260
	Armor:
		Type: Light
	Mobile:
		Speed: 100
	Armament:
		Weapon: R2AirDefense
	Voiced:
		VoiceSet: SovietVehicleVoice
	AutoTarget:
		ScanRadius: 10

r2fajr:
	Inherits: ^R2ModernVehicle
	Tooltip:
		Name: ra2-r2fajr-name
	Buildable:
		BuildPaletteOrder: 61
		Prerequisites: ~faction.iran, naweap, radar
		Description: ra2-r2fajr-description
	Valued:
		Cost: 1300
	Health:
		HP: 200
	Armor:
		Type: Light
	Mobile:
		Speed: 85
	Armament:
		Weapon: R2RocketSalvo
	Voiced:
		VoiceSet: SovietVehicleVoice
	GrantConditionOnMovement@moving:
		Condition: moving
	ReloadDelayMultiplier@emplaced:
		Modifier: 80
		RequiresCondition: !moving

r2mohajer:
	Inherits: ^R2ModernDrone
	Tooltip:
		Name: ra2-r2mohajer-name
	Buildable:
		BuildPaletteOrder: 81
		Prerequisites: ~faction.iran, naweap, radar
		Description: ra2-r2mohajer-description
	Valued:
		Cost: 950
	Health:
		HP: 110
	Armor:
		Type: Light
	Aircraft:
		Speed: 170
	Armament:
		Weapon: R2DroneMissile
	SpawnActorOnDeath:
		Actor: r2mohajerhusk

r2mohajerhusk:
	Inherits: ^R2DroneHusk
	RenderVoxels:
		Image: r2mohajer
