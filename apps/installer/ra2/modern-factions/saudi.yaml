gaairc:
	ProvidesPrerequisite@harrier-saudi:
		Prerequisite: aircraft.harrier
		Factions: saudi

gaweap:
	GrantConditionOnProduction@saudi-helicopter:
		Actors: r2ah64sa
		Condition: roof-open
		Duration: 50
		ShowSelectionBar: false

r2m1a2s:
	Inherits: ^R2ModernVehicle
	Inherits@palette: ^R2SaudiVoxels
	Tooltip:
		Name: ra2-r2m1a2s-name
	Buildable:
		BuildPaletteOrder: 21
		Prerequisites: ~faction.saudi, gaweap
		Description: ra2-r2m1a2s-description
	Valued:
		Cost: 1250
	Health:
		HP: 520
	Armor:
		Type: Heavy
	Mobile:
		Speed: 80
	Turreted:
		TurnSpeed: 24
	Armament:
		Weapon: R2AbramsGun
		LocalOffset: 900,0,450
		MuzzleSequence: muzzle

r2sads:
	Inherits: ^R2ModernVehicle
	Inherits@palette: ^R2SaudiVoxels
	Inherits@AUTOTARGET: ^AutoTargetAir
	Tooltip:
		Name: ra2-r2sads-name
	Buildable:
		BuildPaletteOrder: 41
		Prerequisites: ~faction.saudi, gaweap, radar
		Description: ra2-r2sads-description
	Valued:
		Cost: 1050
	Health:
		HP: 240
	Armor:
		Type: Light
	Mobile:
		Speed: 105
	Turreted:
