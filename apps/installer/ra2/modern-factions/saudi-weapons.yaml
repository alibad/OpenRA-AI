# Guided Saudi weapons carry an extra damage warhead that applies only to
# actors currently marked by a JTAC laser (R2Lased). Unguided fire gains nothing.
R2GuardRifle:
	Inherits: M60
	Range: 5c0
	ReloadDelay: 34
	Burst: 3
	BurstDelays: 3
	Report: ra2|modern-factions/audio/redsea-guard-rifle.wav
	Warhead@1Dam: SpreadDamage
		Damage: 9

R2SaudiATGM:
	Inherits: Maverick
	Range: 8c0
	MinRange: 2c0
	ReloadDelay: 110
	Report: ra2|modern-factions/audio/redsea-atgm-launch.wav
	Projectile: Missile
		Speed: 256
		MinimumLaunchAngle: 0
		MaximumLaunchAngle: 32
		CruiseAltitude: 768
		RangeLimit: 12c0
	Warhead@1Dam: SpreadDamage
		Damage: 100
