Player:
	PlayerResources:
		DefaultCash: 6000

World:
	LuaScript:
		Scripts: campaign.lua, utils.lua, jizan-corridor.lua
	MissionData:
		Briefing: briefing
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: dropdown-difficulty.label
		Description: dropdown-difficulty.description
		Values:
			easy: options-difficulty.easy
			normal: options-difficulty.normal
			hard: options-difficulty.hard
		Default: normal

# Keep the Saudi production panel focused on the new faction roster.  Economy
# support units remain available, but legacy Allied combat vehicles do not leak
# into this mission's war-factory queue.
1TNK:
	Buildable:
		Prerequisites: ~disabled

2TNK:
	Buildable:
		Prerequisites: ~disabled

ARTY:
	Buildable:
		Prerequisites: ~disabled

JEEP:
	Buildable:
		Prerequisites: ~disabled

MRJ:
	Buildable:
		Prerequisites: ~disabled

MNLY:
	Buildable:
		Prerequisites: ~disabled

# E7.noautotarget inherits E7 in campaign-rules.yaml.  Without explicit mission
# gating both actors appear as separate, identical Tanya buttons.
E7:
	Buildable:
		Prerequisites: ~disabled

E7.noautotarget:
